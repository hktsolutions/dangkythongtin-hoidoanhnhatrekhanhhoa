<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo bảo trì</title>
    <style>
        /* CSS dùng để căn giữa nội dung màn hình */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa; /* Nền xám nhạt ngoài khung */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Chiếm toàn bộ chiều cao màn hình */
            margin: 0;
        }

        /* Styling cho khung thông báo - Màu đỏ chủ đạo */
        .maintenance-container {
            background-color: #fff0f0; /* Màu nền đỏ rất nhạt */
            color: #b00020; /* Màu chữ đỏ sẫm */
            border: 1px solid #ffd2d2; /* Viền đỏ nhạt */
            border-radius: 12px; /* Bo góc mềm mại */
            padding: 40px; /* Tăng padding để thoáng hơn */
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); /* Bóng nhẹ để nổi bật */
            line-height: 1.6;
        }

        .maintenance-title {
            font-size: 24px; /* Tăng kích thước tiêu đề */
            font-weight: bold;
            margin-bottom: 20px;
            color: #d9534f; /* Tiêu đề đỏ đậm nổi bật */
        }

        .maintenance-text {
            font-size: 16px;
            margin-bottom: 12px;
        }
        
        .maintenance-text strong {
            color: #dc3545; /* Nhấn mạnh thời gian bằng màu đỏ mạnh */
            font-weight: 700;
        }

        .maintenance-text em {
            color: #721c24; /* Màu chữ nghiêng sẫm hơn */
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="maintenance-title">Thông Báo Bảo Trì Hệ Thống</div>
        <div class="maintenance-text">
            Hệ thống đang được bảo trì đến <strong>24h00 ngày 14/06/2026</strong>.
        </div>
        <div class="maintenance-text">
            Trong thời gian này, một số chức năng có thể tạm thời gián đoạn. Mọi vấn đề cần hỗ trợ, vui lòng liên hệ Thư ký Hội.
        </div>
        <div class="maintenance-text">
            <em>Xin cảm ơn sự thông cảm của bạn!</em>
        </div>
    </div>

</body>
</html>
