<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thông báo bảo trì hệ thống</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
  }
  .box {
    max-width: 480px;
    width: 100%;
    background: #ffffff;
    border: 2px solid #d32f2f;
    border-top: 8px solid #d32f2f;
    border-radius: 8px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(211, 47, 47, 0.15);
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    background: #d32f2f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 32px;
    font-weight: bold;
  }
  h1 {
    color: #d32f2f;
    font-size: 22px;
    margin: 0 0 16px;
  }
  p {
    color: #333333;
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .note {
    margin-top: 20px;
    font-size: 14px;
    color: #d32f2f;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">!</div>
    <h1>Hệ thống đang bảo trì</h1>
    <p>Chúng tôi đang tiến hành bảo trì để nâng cao chất lượng dịch vụ.</p>
    <p>Vui lòng liên hệ <strong>Văn phòng hội</strong> để được hỗ trợ.</p>
    <div class="note">Xin lỗi vì sự bất tiện này!</div>
  </div>
</body>
</html>
